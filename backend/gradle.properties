# --- Build speed (dev rebuild loop) ---
# build/ is persisted via a Docker cache mount (see Dockerfile), so incremental Kotlin compile
# state survives between builds → a code change recompiles only changed files.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=false
kotlin.incremental=true

ktor_version=3.0.1
kotlin_version=2.0.21
logback_version=1.4.14
exposed_version=0.56.0
sqlite_version=3.47.0.0
paho_mqtt_version=1.2.5
snakeyaml_version=2.3
coroutines_version=1.9.0
jakarta_mail_version=2.0.1
