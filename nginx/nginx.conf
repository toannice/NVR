worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for faster web performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Increase upload limits if needed
    client_max_body_size 50M;

    # HTTP: ONVIF endpoints served directly (ONVIF standard uses HTTP, not HTTPS)
    # Everything else redirects to HTTPS.
    # Cổng đổi 80 → 9000 (2026-07-29). XAddr mà NVR quảng bá cho AiView Box phải kèm :9000 —
    # xem ONVIF_HTTP_PORT trong docker-compose.yml / OnvifServerService.kt.
    server {
        listen 9000;
        server_name _;

        location /onvif/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Camera Bkav đẩy sự kiện AI về bằng HTTP thuần (firmware không làm TLS tự ký). Phải có
        # location riêng: nhánh `/` bên dưới trả 301 sang HTTPS, camera POST sẽ mất body và im lặng
        # bỏ sự kiện. X-Real-IP là thứ backend dùng để nhận ra camera nào gửi → không được bỏ.
        location /api/bkav/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Nvr-System "Protected";

        # Block access to ALL hidden files and specific dangerous extensions
        location ~ /\. { deny all; access_log off; log_not_found off; }
        location ~* \.(env|yml|yaml|db|sqlite|log|conf)$ { deny all; access_log off; log_not_found off; }

        # ─── Upload gói cập nhật OTA ────────────────────────────────────────────────
        # Tách location riêng vì gói .nvrup tới hàng GB, mà nhánh `/` bên dưới giới hạn
        # client_max_body_size 50M (đủ cho mọi API khác — giữ nguyên là đúng, không nới
        # toàn cục chỉ vì một endpoint).
        #
        # proxy_request_buffering off LÀ BẮT BUỘC: mặc định nginx nhận HẾT body vào bộ đệm
        # (RAM rồi tràn ra /var/cache/nginx) TRƯỚC khi chuyển cho backend. Với gói 4GB nghĩa
        # là cần thêm 4GB đĩa trên phân vùng hệ thống — mà máy field ổ nhỏ, và đó lại đúng
        # là lúc ta vừa kiểm "còn đủ chỗ" bằng usableSpace của phân vùng data. Tắt đệm thì
        # byte chảy thẳng vào backend, dùng bộ nhớ hằng số ở cả hai phía.
        location /api/ota/upload {
            proxy_pass http://127.0.0.1:3000;

            client_max_body_size 4G;
            proxy_request_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Đủ cho 4GB qua đường LAN chậm. KHÔNG đặt send_timeout 30s như nhánh `/`:
            # cái đó dùng để dọn client xem video đã treo, còn ở đây client đang chủ động
            # đẩy dữ liệu lên và có thể im lặng khá lâu giữa các chunk.
            proxy_read_timeout    1800s;
            proxy_send_timeout    1800s;
            proxy_connect_timeout 60s;
        }

        location / {
            # Proxy to nvr-wrapper running on port 3000
            # Since nvr-wrapper is in host mode, we can talk to it on 127.0.0.1
            proxy_pass http://127.0.0.1:3000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running video streams
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            # Reap dead clients: a frozen browser tab keeps the socket open but stops
            # reading — without this the stream connection lingers for hours and starves
            # Chrome's per-host connection quota (all live tiles go black silently).
            send_timeout 30s;
        }

        # Optimization: serve static files directly if needed, 
        # but nvr-wrapper already does this efficiently.
    }
}
