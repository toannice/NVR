worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for faster web performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Increase upload limits if needed
    client_max_body_size 50M;

    # HTTP: ONVIF endpoints served directly (ONVIF standard uses HTTP, not HTTPS)
    # Everything else redirects to HTTPS.
    server {
        listen 80;
        server_name _;

        location /onvif/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Nvr-System "Protected";

        # Block access to ALL hidden files and specific dangerous extensions
        location ~ /\. { deny all; access_log off; log_not_found off; }
        location ~* \.(env|yml|yaml|db|sqlite|log|conf)$ { deny all; access_log off; log_not_found off; }

        location / {
            # Proxy to nvr-wrapper running on port 3000
            # Since nvr-wrapper is in host mode, we can talk to it on 127.0.0.1
            proxy_pass http://127.0.0.1:3000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running video streams
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Optimization: serve static files directly if needed, 
        # but nvr-wrapper already does this efficiently.
    }
}
