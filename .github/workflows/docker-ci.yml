name: CI/CD Pipeline cho NVR

on:
  push:
    tags:
      - 'v*.*.*' # Chạy pipeline khi push một tag version (ví dụ: v1.0.0)

jobs:
  test:
    name: Kiểm thử Server-side
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Khởi tạo môi trường Backend
      - name: Lắp đặt Kotlin/Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache cho Gradle
        uses: gradle/gradle-build-action@v2

      # Chạy Unit Test Logic
      - name: Chạy Unit Test Backend
        run: ./gradlew backend:test
        
  build-push:
    name: Đóng gói Docker và Đẩy lên GHCR
    needs: test # Chỉ đóng gói nếu khâu Test Pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Xem xét thông tin Tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Login vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
