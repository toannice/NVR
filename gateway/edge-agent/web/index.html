<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NVR Edge Gateway</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
  header { padding: 16px 20px; background: #1e293b; border-bottom: 1px solid #334155; }
  header h1 { font-size: 18px; margin: 0; }
  header small { color: #94a3b8; }
  main { max-width: 720px; margin: 0 auto; padding: 20px; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #334155; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin: 12px 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 160px; }
  input { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 15px; }
  .muted { color: #94a3b8; font-size: 13px; }
  .tag { background: #064e3b; color: #6ee7b7; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .err { color: #fca5a5; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
</style>
</head>
<body>
<header>
  <h1>NVR Edge Gateway</h1>
  <small id="gwInfo">đang tải…</small>
</header>
<main>
  <div class="row">
    <button id="scanBtn" onclick="scan()">🔍 Quét camera</button>
    <span id="scanMsg" class="muted"></span>
  </div>

  <h2>Camera tìm thấy trên mạng</h2>
  <div id="found"></div>

  <h2>Camera đã thêm vào gateway</h2>
  <div id="added"></div>

  <p class="muted">Thêm camera ở đây chỉ tạo cổng chuyển tiếp trên gateway. Quản trị viên NVR sẽ nhập tài khoản và kết nối sau — trang này không cần mật khẩu camera.</p>
</main>

<script>
async function api(path, opts) {
  const r = await fetch(path, opts);
  const t = await r.text();
  let j = {}; try { j = t ? JSON.parse(t) : {}; } catch (e) {}
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

async function refresh() {
  try {
    const h = await api('/health');
    document.getElementById('gwInfo').textContent =
      `${h.gatewayName} · ZeroTier ${h.zerotierIp || '(chưa có IP)'} · RAM ${h.ramMb}MB · nginx ${h.nginxOk ? 'OK' : 'LỖI'}`;
    renderAdded(h.cameras || []);
  } catch (e) {
    document.getElementById('gwInfo').innerHTML = `<span class="err">Lỗi: ${e.message}</span>`;
  }
}

function renderAdded(cams) {
  const el = document.getElementById('added');
  if (!cams.length) { el.innerHTML = '<p class="muted">Chưa có camera nào.</p>'; return; }
  el.innerHTML = cams.map(c => `
    <div class="card row">
      <div class="grow"><b>${c.name || c.localIp}</b><div class="muted">${c.localIp} → ONVIF :${c.onvifPort} · RTSP :${c.rtspPort}</div></div>
      <button class="ghost" onclick="del('${c.localIp}')">Xoá</button>
    </div>`).join('');
}

async function scan() {
  const btn = document.getElementById('scanBtn'), msg = document.getElementById('scanMsg');
  btn.disabled = true; msg.textContent = 'Đang quét (~4s)…';
  try {
    const r = await api('/discovery', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    renderFound(r.devices || []);
    msg.textContent = `Tìm thấy ${ (r.devices||[]).length } thiết bị`;
  } catch (e) { msg.innerHTML = `<span class="err">${e.message}</span>`; }
  btn.disabled = false;
}

function renderFound(devs) {
  const el = document.getElementById('found');
  if (!devs.length) { el.innerHTML = '<p class="muted">Chưa quét hoặc không thấy camera.</p>'; return; }
  el.innerHTML = devs.map((d, i) => `
    <div class="card">
      <div class="row"><div class="grow"><b>${d.ip}</b> <span class="tag">${d.hardware || 'ONVIF'}</span><div class="muted">${d.name || ''}</div></div></div>
      <div class="row" style="margin-top:10px">
        <input class="grow" id="name_${i}" placeholder="Tên camera (vd: Cổng trước)" value="${d.name || ''}">
        <button onclick="add('${d.ip}', ${i})">Thêm</button>
      </div>
    </div>`).join('');
}

async function add(ip, i) {
  const name = document.getElementById('name_' + i).value || ip;
  try {
    await api('/camera', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ localIp: ip, name }) });
    await refresh();
  } catch (e) { alert('Lỗi: ' + e.message); }
}

async function del(ip) {
  if (!confirm('Xoá cổng chuyển tiếp cho ' + ip + '?')) return;
  try { await api('/camera?localIp=' + encodeURIComponent(ip), { method: 'DELETE' }); await refresh(); }
  catch (e) { alert('Lỗi: ' + e.message); }
}

refresh();
</script>
</body>
</html>
