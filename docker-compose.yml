services:

  # ─── Message Broker ────────────────────────────────────────
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks:
      - nvr-backend
    ports:
      - "1883:1883" # MQTT (local LAN access for IoT sensors)
      - "9001:9001" # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frigate NVR Engine ────────────────────────────────────
  frigate:
    container_name: frigate
    privileged: true
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:${FRIGATE_VERSION:-0.16.3}
    shm_size: "1024mb"
    networks:
      - nvr-backend
    ports:
      - "5000:5000" # Frigate Web UI & API (dev/admin access)
      - "8554:8554" # RTSP re-stream feeds
      - "1984:1984" # go2rtc API & video streams
      - "8555:8555/udp" # go2rtc WebRTC UDP (cloud live view ICE candidates)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000 # 1GB RAM buffer (reduces SSD wear, prevents I/O bottleneck)
    devices:
      - /dev/dri/renderD128 # Intel VAAPI hardware acceleration
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - FRIGATE_HOST_IP=${FRIGATE_HOST_IP}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:5000/api/version || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── NVR Wrapper (Our App) ─────────────────────────────────
  nvr-wrapper:
    container_name: nvr-wrapper
    image: ghcr.io/toannice/nvr:${WRAPPER_TAG:-latest} # GHCR image để OTA. latest=stable(main), staging=beta. Prod để mặc định latest.
    # build: .
    restart: unless-stopped
    network_mode: "host" # Required for ONVIF multicast (WS-Discovery) to work
    # ports:
    #   - "3000:3000" # Expose via Nginx (443) instead for security
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./media:/app/media
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock # Allows `docker restart frigate`
      - /run/systemd/resolve/resolv.conf:/app/dns_config:ro
      - /etc/localtime:/etc/localtime:ro
      - /sys/class/drm:/sys/class/drm:ro  # GPU vendor detection for hwaccel config
    depends_on:
      frigate:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    secrets:
      - gmail_app_password
      - edge_agent_token                       # Shared fleet token for edge gateways (4-6 Plan A)
      - zt_controller_token                    # ZeroTier controller authtoken — NVR authorizes members itself
      - nebula_sign_token                      # Nebula HQ signing-service admin token (ZeroTier→Nebula migration)
    environment:
      - FRIGATE_URL=http://localhost:5000
      - MQTT_URL=tcp://localhost:1883
      - PORT=3000
      - CONFIG_PATH=config/config.yml
      - APP_VERSION=${APP_VERSION:-1.2.0}
      - DEPLOY_VERSION=${DEPLOY_VERSION:-dev}   # Injected by GitHub Actions — shows on Web UI
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - GMAIL_USER=${GMAIL_USER}               # Username is not sensitive, stays as env var
      - DC_BRIDGE_PATH=${DC_BRIDGE_PATH:-}    # Optional: path to dc-bridge binary (default: ~/.aiview/dc-bridge)
      - E2E_TEST_MODE=${E2E_TEST_MODE:-false} # Set true in .env to enable /api/dev/* endpoints for E2E tests
      # ─── Edge gateway auto-provisioning (4-6 Plan A) ───
      - ZT_SCAN_SUBNET=${ZT_SCAN_SUBNET:-}    # ZeroTier subnet to auto-scan for gateways, e.g. 10.34.24.0/24 (empty = disabled)
      - EDGE_AGENT_PORT=${EDGE_AGENT_PORT:-9797}
      - GATEWAY_SCAN_INTERVAL_SEC=${GATEWAY_SCAN_INTERVAL_SEC:-30}
      - ZT_CONTROLLER_URL=${ZT_CONTROLLER_URL:-} # Self-hosted ZT controller API, e.g. http://192.168.2.106:9993 (empty = NVR authorize disabled)
      - ZT_NETWORK_ID=${ZT_NETWORK_ID:-}        # Fleet network id the gateways join (for controller member API)
      # ─── Nebula overlay (ZeroTier→Nebula migration; empty = ZeroTier stays active) ───
      - NEBULA_CA_URL=${NEBULA_CA_URL:-}         # HQ signing-service base URL, e.g. http://192.168.2.106:9443
      - NEBULA_OVERLAY_SUBNET=${NEBULA_OVERLAY_SUBNET:-}  # Nebula subnet to auto-scan, e.g. 10.10.20.0/24
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Nginx Security Gateway (HTTPS) ────────────────────────
  nginx:
    container_name: nvr-nginx
    image: nginx:stable-alpine
    restart: unless-stopped
    network_mode: "host" # Needs to talk to nvr-wrapper on localhost:3000
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./nginx/server.key:/etc/nginx/ssl/server.key:ro
    depends_on:
      - nvr-wrapper

  # ─── NVR Watchdog ─────────────────────────────────────────────────────────
  # Replaces Watchtower. Monitors system health, self-heals, and handles OTA
  # with rollback support. Runs independently — restart: always.
  nvr-watchdog:
    container_name: nvr-watchdog
    #image: ghcr.io/toannice/nvr-watchdog:latest
    build: ./watchdog
    restart: always             # Always restarts — must survive crashes
    hostname: ${HOSTNAME:-nvr-edge-node}
    network_mode: "host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Read container states & Execute Compose
      - ${PWD:-/home/toan/my-nvr}:${PWD:-/home/toan/my-nvr} # Allow Watchdog to run docker-compose
      - ./config/watchdog.yml:/config/watchdog.yml:ro  # Config (read-only)
      - ./media/recordings:/recordings                # Measure disk & cleanup via path
      - /root/.docker/config.json:/root/.docker/config.json:ro  # Pull private GHCR images
      - watchdog-data:/data    # events.db, reports/, version_state.json
    environment:
      - PROJECT_DIR=${PWD:-/home/toan/my-nvr}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - HOSTNAME=${HOSTNAME:-nvr-edge-node}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
      - WRAPPER_TAG=${WRAPPER_TAG:-latest}  # OTA target tag — watchdog.yml ${WRAPPER_TAG} resolves to this (update + rollback dùng chung)
    depends_on:
      - nvr-wrapper

  # ─── Secrets ───────────────────────────────────────────────
secrets:
  gmail_app_password:
    file: ./secrets/gmail_app_password
  edge_agent_token:
    file: ./secrets/edge_agent_token
  zt_controller_token:
    file: ./secrets/zt_controller_token
  nebula_sign_token:
    file: ./secrets/nebula_sign_token

# ─── Networks ──────────────────────────────────────────────
networks:
  nvr-backend:
    name: nvr-backend
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────
volumes:
  watchdog-data:
    name: nvr-watchdog-data
